<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101411"><meta name="description" content="A simple, focused task tracker. Organize your day with Taskly.">
<link rel="manifest" href="./manifest.webmanifest"><title>Taskly — Task Tracker</title>
<style>
:root{color-scheme:dark;--bg:#101411;--panel:#191f1a;--line:#303a30;--text:#f1f5ef;--muted:#9ba89b;--lime:#c7f36b;--red:#ff7777}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1c281b,var(--bg) 55%);color:var(--text);font:16px/1.45 system-ui,-apple-system,sans-serif}.app{max-width:760px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 18px 35px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:850}.logo{width:40px;height:40px;background:var(--lime);color:#17200d;border-radius:13px;display:grid;place-items:center;font-size:24px}.date{color:var(--muted);font-size:13px;text-align:right}.hero{margin:28px 0 22px}.eyebrow{color:var(--lime);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.hero h1{font-size:clamp(32px,7vw,46px);line-height:1.06;letter-spacing:-1.7px;margin:8px 0}.hero p{color:var(--muted);margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.stat,.addbox,.task{background:var(--panel);border:1px solid var(--line);border-radius:18px}.stat{padding:14px}.stat strong{display:block;font-size:26px}.stat span{font-size:12px;color:var(--muted)}.accent{color:var(--lime)}.addbox{padding:16px}.section-title{font-size:17px;margin:0 0 13px}.formrow{display:flex;gap:9px}.field{font:inherit;width:100%;min-width:0;background:#111712;color:var(--text);border:1px solid #374237;border-radius:12px;padding:13px;outline:none}.field:focus{border-color:var(--lime)}button{font:inherit;cursor:pointer}.addbtn{border:0;border-radius:12px;background:var(--lime);color:#17200d;font-weight:850;padding:0 18px;white-space:nowrap}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.options>*{font-size:14px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:25px 0 12px}.toolbar h2{font-size:19px;margin:0}.filters{display:flex;gap:7px;margin:12px 0}.filter{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 13px;border-radius:999px;font-size:13px}.filter.active{background:var(--lime);border-color:var(--lime);color:#17200d;font-weight:800}.tasklist{display:grid;gap:9px}.task{display:flex;align-items:flex-start;gap:11px;padding:14px}.task.done{opacity:.58}.check{accent-color:var(--lime);width:21px;height:21px;flex:none;margin:2px 0 0}.taskbody{flex:1;min-width:0}.taskname{font-weight:700;overflow-wrap:anywhere}.done .taskname{text-decoration:line-through;color:var(--muted)}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px;color:var(--muted);font-size:12px}.pill{padding:3px 8px;border-radius:999px;background:#202820}.pill.overdue{color:var(--red)}.actions{display:flex;gap:3px}.iconbtn{border:0;background:transparent;color:var(--muted);font-size:20px;padding:2px 6px}.empty{text-align:center;padding:34px 12px;border:1px dashed #3a453a;border-radius:16px;color:var(--muted)}.footer{text-align:center;color:#6f7b70;font-size:12px;margin:24px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:#e5f9c1;color:#17200d;padding:11px 16px;border-radius:12px;font-weight:750;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:620px){.app{padding-left:28px;padding-right:28px}.options{grid-template-columns:1fr 1fr 1fr}}@media(max-width:420px){.formrow{flex-direction:column}.addbtn{padding:12px}.toolbar{align-items:flex-start}.stat{padding:11px 9px}.stat strong{font-size:23px}}
</style></head>
<body><main class="app">
<header><div class="brand"><div class="logo">✓</div> taskly<span class="accent">.</span></div><div class="date" id="today"></div></header>
<section class="hero"><div class="eyebrow">Make today count</div><h1>Small steps.<br><span class="accent">Big progress.</span></h1><p>One clear task at a time. You've got this.</p></section>
<section class="stats"><div class="stat"><strong id="total">0</strong><span>Total tasks</span></div><div class="stat"><strong class="accent" id="completed">0</strong><span>Completed</span></div><div class="stat"><strong id="remaining">0</strong><span>To do</span></div></section>
<section class="addbox"><h2 class="section-title" id="formTitle">＋ Add a task</h2><form id="taskForm"><div class="formrow"><input class="field" id="taskInput" maxlength="160" placeholder="What do you need to do?" required autocomplete="off"><button class="addbtn" id="submitBtn">Add task +</button></div><div class="options"><select class="field" id="category" aria-label="Category"><option>Personal</option><option>Study</option><option>Work</option><option>Health</option></select><select class="field" id="priority" aria-label="Priority"><option>Normal</option><option>High</option><option>Low</option></select><input class="field" id="dueDate" type="date" aria-label="Due date"></div></form></section>
<div class="toolbar"><h2>Your tasks <span id="taskCount" style="color:var(--muted);font-weight:500"></span></h2><button id="clearDone" class="filter">Clear completed</button></div>
<nav class="filters" id="filters"><button class="filter active" data-filter="All">All</button><button class="filter" data-filter="Active">To do</button><button class="filter" data-filter="Completed">Completed</button></nav>
<div class="tasklist" id="taskList"></div><div class="footer">Your tasks stay on this device · No account needed</div></main><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);$('today').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
let tasks=[],filter='All',editingId=null;try{tasks=JSON.parse(localStorage.getItem('taskly_tasks_v1')||'[]')}catch(e){}
const save=()=>{localStorage.setItem('taskly_tasks_v1',JSON.stringify(tasks));renderStats();renderTasks()};
let toastTimer;function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function renderStats(){$('total').textContent=tasks.length;$('completed').textContent=tasks.filter(t=>t.done).length;$('remaining').textContent=tasks.filter(t=>!t.done).length;$('taskCount').textContent=tasks.length?'('+tasks.length+')':''}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderTasks(){const list=$('taskList'),shown=tasks.filter(t=>filter==='All'||(filter==='Active'&&!t.done)||(filter==='Completed'&&t.done)).sort((a,b)=>Number(a.done)-Number(b.done)||({High:0,Normal:1,Low:2}[a.priority]-{High:0,Normal:1,Low:2}[b.priority])||b.created-a.created);if(!shown.length){list.innerHTML='<div class="empty"><div style="font-size:30px">✨</div><strong>'+ (filter==='Completed'?'Nothing completed yet':'All clear!')+'</strong><div style="font-size:13px;margin-top:4px">Add a task above and make your next move.</div></div>';return}list.innerHTML=shown.map(t=>{const overdue=t.due&&!t.done&&t.due<new Date().toISOString().slice(0,10),dueText=t.due?(overdue?'Overdue · ':'')+new Date(t.due+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';return '<article class="task '+(t.done?'done':'')+'"><input class="check" type="checkbox" aria-label="Mark task complete" data-check="'+t.id+'" '+(t.done?'checked':'')+'><div class="taskbody"><div class="taskname">'+esc(t.title)+'</div><div class="meta"><span class="pill">'+esc(t.category)+'</span><span class="pill '+(t.priority==='High'?'overdue':'')+'">'+(t.priority==='High'?'⚡ ':'')+esc(t.priority)+' priority</span>'+(dueText?'<span class="pill '+(overdue?'overdue':'')+'">◷ '+esc(dueText)+'</span>':'')+'</div></div><div class="actions"><button class="iconbtn" title="Edit task" data-edit="'+t.id+'">✎</button><button class="iconbtn" title="Delete task" data-delete="'+t.id+'">×</button></div></article>'}).join('')}
$('taskForm').addEventListener('submit',e=>{e.preventDefault();const title=$('taskInput').value.trim();if(!title)return;if(editingId){const t=tasks.find(x=>x.id===editingId);if(t)Object.assign(t,{title,category:$('category').value,priority:$('priority').value,due:$('dueDate').value});editingId=null;$('formTitle').textContent='＋ Add a task';$('submitBtn').textContent='Add task +';toast('Task updated')}else{tasks.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),title,category:$('category').value,priority:$('priority').value,due:$('dueDate').value,done:false,created:Date.now()});toast('Task added ✓')}$('taskInput').value='';$('category').value='Personal';$('priority').value='Normal';$('dueDate').value='';save()});
$('taskList').addEventListener('change',e=>{if(e.target.matches('[data-check]')){const t=tasks.find(x=>x.id===e.target.dataset.check);if(t){t.done=e.target.checked;save();toast(t.done?'Task completed 🎉':'Moved to to do')}}});
$('taskList').addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){const t=tasks.find(x=>x.id===edit.dataset.edit);if(!t)return;editingId=t.id;$('taskInput').value=t.title;$('category').value=t.category;$('priority').value=t.priority;$('dueDate').value=t.due||'';$('formTitle').textContent='✎ Edit task';$('submitBtn').textContent='Save changes';$('taskInput').focus();scrollTo({top:0,behavior:'smooth'})}if(del){const t=tasks.find(x=>x.id===del.dataset.delete);if(t&&confirm('Delete "'+t.title+'"?')){tasks=tasks.filter(x=>x.id!==t.id);save();toast('Task deleted')}}});
$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('#filters [data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderTasks()});
$('clearDone').addEventListener('click',()=>{const n=tasks.filter(t=>t.done).length;if(!n){toast('No completed tasks to clear');return}if(confirm('Clear '+n+' completed task(s)?')){tasks=tasks.filter(t=>!t.done);save();toast('Completed tasks cleared')}});
renderStats();renderTasks();
if('serviceWorker'in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
